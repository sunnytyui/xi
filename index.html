<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>曦月肥鱼网</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;min-height:100vh;overflow:hidden;position:relative;background:linear-gradient(175deg,#dce6f0 0%,#bccddb 38%,#a0b8cb 72%,#8aa3bb 100%)}
#rainCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.container{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px}
.glass-panel{position:relative;background:rgba(245,248,252,.18);backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px) saturate(1.1);border:1px solid rgba(240,244,250,.42);border-radius:24px;padding:40px 36px;text-align:center;box-shadow:0 20px 64px rgba(74,104,140,.17),0 4px 12px rgba(56,84,118,.08),inset 0 1px 0 rgba(255,255,255,.62),inset 0 0 32px rgba(226,236,246,.12);max-width:520px;width:100%;overflow:hidden}
.glass-panel::before{content:'';position:absolute;top:-60%;left:-60%;width:220%;height:220%;background:radial-gradient(circle at 23% 31%,rgba(253,254,255,.09) 0%,transparent 3%),radial-gradient(circle at 67% 54%,rgba(251,253,255,.065) 0%,transparent 2.2%),radial-gradient(circle at 41% 77%,rgba(249,252,255,.055) 0%,transparent 2.5%);pointer-events:none}
h1{color:rgba(47,69,97,.86);margin-bottom:24px;font-size:2.1em;letter-spacing:2px;text-shadow:0 1px 4px rgba(241,246,252,.66)}
.display-area{background:rgba(238,243,250,.27);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(234,239,246,.33);border-radius:16px;padding:30px 24px;margin-bottom:22px;min-height:124px;display:flex;justify-content:center;align-items:center;box-shadow:inset 0 2px 10px rgba(46,68,98,.035)}
.result-text{font-size:2.1em;font-weight:700;color:rgba(42,63,91,.93);text-shadow:0 1px 4px rgba(238,242,250,.57);transition:all .3s}
.result-text.rolling{animation:pulse .12s infinite;color:rgba(66,105,155,.76)}
.result-text.revealed{animation:bounce .65s ease;font-size:2.6em;color:#2563ab;text-shadow:0 1px 5px rgba(237,242,250,.73),0 0 22px rgba(79,156,229,.22)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.btn{background:rgba(238,243,250,.37);color:rgba(49,73,107,.87);border:1px solid rgba(233,239,248,.53);padding:15px 40px;font-size:1.18em;font-weight:600;border-radius:50px;cursor:pointer;transition:all .3s;margin:8px 6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 10px rgba(71,103,142,.097),inset 0 1px 0 rgba(249,252,255,.61)}
.btn:hover{background:rgba(243,248,255,.51);transform:translateY(-3px)}
.btn:disabled{opacity:.43;cursor:not-allowed;transform:none}
.btn-sound{background:rgba(91,134,181,.30);color:rgba(38,66,102,.92);border-color:rgba(91,134,181,.42)}
#audioStatus{display:block;margin:10px 0 4px;font-size:.9em;color:rgba(56,82,117,.72);min-height:1.2em}
.stats{margin-top:16px;color:rgba(67,91,125,.545);font-size:.925em}
.history{margin-top:14px;padding:14px 16px;background:rgba(231,238,247,.195);border:1px solid rgba(224,232,242,.285);border-radius:12px;max-height:148px;overflow-y:auto;text-align:left}
.history h3{color:rgba(56,82,117,.695);margin-bottom:10px;font-size:1em}
.history-item{padding:4px 0;border-bottom:1px solid rgba(56,83,119,.068);font-size:.89em;color:rgba(56,82,116,.595)}
.history-item:last-child{border-bottom:none}
#soundBar{position:fixed;right:18px;bottom:18px;z-index:5;display:flex;align-items:center;gap:10px;background:rgba(245,248,252,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(240,244,250,.4);border-radius:30px;padding:8px 14px}
#soundBar button{background:none;border:none;cursor:pointer;font-size:1.1em;color:rgba(49,73,107,.8)}
#soundBar input{width:90px;accent-color:#5b86b5}
.vw{background:rgba(238,243,250,.27);border:1px solid rgba(234,239,246,.33);border-radius:16px;padding:14px;margin-bottom:16px;text-align:left}
.vw-h{display:flex;gap:8px;margin-bottom:8px}
.vw input[type=text]{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid rgba(233,239,248,.6);background:rgba(255,255,255,.45);color:#2a3f5b;font-size:.9em;outline:none}
.vwb{padding:8px 14px;border-radius:9px;border:1px solid rgba(91,134,181,.42);background:rgba(91,134,181,.3);color:#264266;font-size:.9em;font-weight:600;cursor:pointer;white-space:nowrap}
.vwf{position:relative;display:inline-block;padding:7px 12px;border-radius:9px;border:1px dashed rgba(91,134,181,.5);font-size:.82em;cursor:pointer}
.vwf input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.vwt{font-size:.72em;color:rgba(67,91,125,.5);display:inline;margin-left:8px}
.vwl{max-height:110px;overflow-y:auto;margin:8px 0;display:flex;flex-direction:column;gap:5px}
.vwi{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.3);font-size:.83em;color:#2a3f5b}
.vwi.cur{background:rgba(91,134,181,.22)}
.vwi .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.vwi .d{border:none;background:none;color:#965;cursor:pointer}
.vwp{width:100%;aspect-ratio:16/9;background:rgba(40,60,85,.18);border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vwp video,.vwp iframe{width:100%;height:100%;border:0;object-fit:contain;background:#000}
.vws{margin-top:8px;font-size:.83em;color:rgba(56,82,117,.75);min-height:1.2em;text-align:center}
#stats,.history{display:none!important}/* layout-v2 */
html,body{height:auto!important}
body{overflow-x:hidden!important;overflow-y:auto!important}
.container{display:block!important;padding:20px 16px 76px!important;min-height:100vh!important}
.glass-panel{margin:0 auto!important;max-width:560px!important;padding:26px 24px!important}
.glass-panel h1{margin:0 0 16px!important;font-size:1.85em!important}
.vw{margin:0 0 16px!important;padding:12px!important;border-radius:14px!important}
.vw-h{margin:0 0 8px!important}
.vw label.vwf,.vw .vwt{vertical-align:middle}
.vwl{max-height:88px!important;margin:8px 0!important}
.vwp{max-height:240px!important;border-radius:10px!important}
.vws{margin-top:8px!important;font-size:.8em!important}
.glass-panel>div:not(.vw):not(.history):not(#stats){display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin:0!important}
.btn{margin:6px 4px!important;padding:13px 30px!important;font-size:1.08em!important}
#playSoundBtn,#audioStatus,#stats,.history{display:none!important}
#soundBar{right:12px!important;bottom:12px!important;padding:6px 10px!important;gap:7px!important;z-index:9}
#soundBar input{width:72px!important}/* fish-egg-v1 */
.vw{position:relative!important}
#fishEgg{position:absolute;right:2px;bottom:8px;z-index:6;cursor:pointer;transform:translateX(125%);transition:transform 1.1s cubic-bezier(.22,1,.36,1)}
#fishEgg.peek{transform:translateX(0)}
.fishFloat{animation:fishFloat 3.2s ease-in-out infinite;transform-origin:50% 80%}
@keyframes fishFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.fishEye{transform-box:fill-box;transform-origin:center;animation:fishBlink 3.6s infinite}
@keyframes fishBlink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}/* game-tabs-v1 */
.glass-panel{max-width:760px!important}
.glass-panel.game-on>.homeEl{display:none!important}
.glass-panel>.homeEl{max-width:560px;margin-left:auto;margin-right:auto}
#gameTabs{display:flex;gap:5px;overflow-x:auto;justify-content:center;margin:0 0 10px;padding-bottom:3px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#gameTabs button{flex:0 0 auto;padding:5px 11px;border-radius:16px;border:1px solid rgba(233,239,248,.6);background:rgba(255,255,255,.32);color:rgba(42,63,91,.88);font-size:.76em;cursor:pointer;white-space:nowrap}
#gameTabs button.on{background:rgba(91,134,181,.45);color:#fff;border-color:rgba(91,134,181,.6)}
#tabFrame iframe{width:100%;height:64vh;min-height:340px;border:1px solid rgba(233,239,248,.5);border-radius:12px;background:#fff;display:block}/* game-view-v2 */
body{overflow-y:auto!important}
.container{padding:14px 10px 24px!important}
.glass-panel.game-on{max-width:min(96vw,1120px)!important;padding:14px 12px 18px!important;overflow:visible!important}
.glass-panel.game-on>div:not(#gameTabs):not(#tabFrame){margin:0!important}
#gameTabs{position:relative;z-index:2;flex-wrap:nowrap;margin:0 0 10px!important}
#tabFrame{display:block!important;width:100%!important;overflow:visible!important;margin:0!important}
#tabFrame iframe{height:min(calc(100vh - 120px),860px)!important;min-height:480px!important;border-radius:12px}
.glass-panel.game-on #soundBar{top:6px!important;right:10px!important;bottom:auto!important;opacity:.8}
.glass-panel.game-on #fishEgg{display:none!important}
@media(max-width:700px){.glass-panel.game-on{max-width:100vw!important;padding:10px 6px!important}#tabFrame iframe{height:calc(100vh - 130px)!important;min-height:400px!important}}/* game-view-v3 */
.glass-panel:not(.game-on) #tabFrame{display:none!important;height:0!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}
.glass-panel:not(.game-on) #tabFrame iframe{display:none!important;height:0!important;min-height:0!important}
.glass-panel.game-on #tabFrame{display:block!important}
.container{min-height:0!important}/* wx-qq-v1 */
@media(max-width:700px){
html,body{width:100%;overflow-x:hidden!important}
.container{padding:10px 8px 20px!important;min-height:0!important}
.glass-panel{max-width:100%!important;padding:16px 12px!important;border-radius:14px}
.glass-panel h1{font-size:1.5em!important;margin-bottom:12px!important}
.vw{padding:10px!important}
.vw input[type=text]{font-size:16px!important}
.vwp{max-height:200px!important}
#gameTabs{justify-content:flex-start!important}
#gameTabs button{padding:5px 10px}
.btn{width:100%!important;margin:6px 0!important;padding:14px!important;font-size:1.05em!important}
#soundBar{right:8px!important;bottom:8px!important;opacity:.85}
.glass-panel.game-on #tabFrame iframe{height:calc(100vh - 150px)!important;min-height:360px!important}
}</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="dns-prefetch" href="https://cdn.jsdelivr.net"><script src="曦月肥鱼网.audio.js" defer></script></head>
<body>
<canvas id="rainCanvas"></canvas>
<audio id="rainAudio" preload="none" loop></audio>
<div id="soundBar">
  <button id="toggleBtn"></button>
  <input id="volSlider" type="range" min="0" max="100" value="65">
</div>
<div class="container">
  <div class="glass-panel">
    <h1>曦月肥鱼网</h1><div id="newGameNotice" onclick="try{var bs=document.querySelectorAll('#gameTabs button');for(var i=0;i<bs.length;i++){if(bs[i].textContent.indexOf('沉曦境遇')>=0){bs[i].click();break;}}}catch(e){}">
  <span style="font-size:1.15em">&#127918;</span> 新增游戏「沉曦境遇」快来试试吧~
</div>
<style>
#newGameNotice{display:block;margin:0 auto 16px;width:fit-content;max-width:92vw;padding:10px 24px;border-radius:24px;background:linear-gradient(135deg,rgba(255,228,150,.94),rgba(255,186,80,.94));border:1px solid rgba(255,205,110,.95);color:#5a3d00;font-size:.9em;font-weight:700;letter-spacing:.5px;box-shadow:0 6px 22px rgba(220,160,40,.35),0 0 0 3px rgba(255,220,140,.22);cursor:pointer;white-space:nowrap;animation:noticePulse 2.2s ease-in-out infinite;transition:filter .2s,transform .2s;text-align:center}
#newGameNotice:hover{filter:brightness(1.08)}
@keyframes noticePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media(max-width:700px){#newGameNotice{font-size:.75em;padding:8px 14px;margin:12px auto 4px;max-width:94vw}}
</style>
    <div class="vw"><div class="vw-h"><input id="vUrl" type="text" placeholder="视频直链 / B站BV号 / YouTube链接"><button class="vwb" onclick="addV()">＋添加</button></div><label class="vwf">本地视频<input id="vFile" type="file" accept="video/*" onchange="addL(this)"></label><span class="vwt">本地仅本次会话有效链接自动保存</span><div class="vwl" id="vList"></div><div class="vwp" id="vPlayer"><div style="color:rgba(60,85,120,.55);font-size:.88em">尚未添加视频</div></div><div style="text-align:center;margin:8px 0 2px"><button class="vwb" style="padding:5px 14px;font-size:.8em" onclick="startDraw()"> 随机抽播</button></div><div class="vws" id="vStatus">添加视频后点「 随机抽播」随机播放</div></div>
    <button class="btn btn-sound" id="playSoundBtn" onclick="ensureAudio()"> 播放雨声</button>
    <span id="audioStatus">真实雨声录音  雨打窗户</span>
    <div>
      <button class="btn" id="rainBtn" onclick="toggleRain()">聆听雨声</button>
      <button class="btn" id="resetBtn" onclick="resetGame()" style="display:none">再来一次</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="history" id="history" style="display:none"><h3>抽签记录</h3><div id="historyList"></div></div>
  </div>
</div>
<script>
var A=document.getElementById('rainAudio');
var S=document.getElementById('audioStatus');
var PB=document.getElementById('playSoundBtn');
var TG=document.getElementById('toggleBtn');
var VS=document.getElementById('volSlider');
A.volume=0.65;
function ensureAudio(){
  A.volume=parseInt(VS.value,10)/100;
  var p=A.play();
  if(p&&p.then){p.then(function(){S.textContent=' 雨声播放中';PB.style.display='none';TG.textContent='';})
    .catch(function(e){S.textContent=' 播放被拦截：'+e.message+' —— 请点「 播放雨声」';});}
}
A.addEventListener('play',function(){S.textContent=' 雨声播放中';PB.style.display='none';TG.textContent='';});
A.addEventListener('error',function(){S.textContent=' rain.wav 加载失败，请确认它和本页在同一文件夹';});
TG.addEventListener('click',function(e){e.stopPropagation();
  if(A.paused){ensureAudio();}else{A.pause();TG.textContent='';S.textContent='雨声已暂停';}});
VS.addEventListener('input',function(e){e.stopPropagation();A.volume=parseInt(this.value,10)/100;});
document.body.addEventListener('click',function(e){
  if(e.target.closest('#toggleBtn,#volSlider'))return;
  if(A.paused)ensureAudio();
});

// ---- 雨滴视觉 ----
var canvas=document.getElementById('rainCanvas'),ctx=canvas.getContext('2d'),W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
resize();addEventListener('resize',resize);
function Drop(x,y,r){this.x=x;this.y=y;this.r=r||(Math.random()*2.8+1.8);this.vx=(Math.random()-0.5)*0.3;this.vy=Math.random()*0.6+0.4;this.g=0.043+Math.random()*0.016;this.fr=0.993;this.wob=Math.random()*6.28;this.ws=0.013+Math.random()*0.023;this.op=0.68+Math.random()*0.24;this.tail=[];this.alive=true;}
Drop.prototype.update=function(){this.vy+=this.g;this.vx*=this.fr;this.vy*=this.fr;this.wob+=this.ws;this.x+=this.vx+Math.sin(this.wob)*0.007;this.y+=this.vy;this.tail.push({x:this.x,y:this.y});if(this.tail.length>12)this.tail.shift();if(this.y>H+30||this.x<-30||this.x>W+30)this.alive=false;};
Drop.prototype.draw=function(c){if(this.tail.length>1){c.beginPath();for(var i=0;i<this.tail.length;i++){var t=this.tail[i];i?c.lineTo(t.x,t.y):c.moveTo(t.x,t.y);}c.strokeStyle='rgba(169,193,215,'+(this.op*0.078)+')';c.lineWidth=this.r*0.33;c.lineCap='round';c.stroke();}
var g=c.createRadialGradient(this.x-this.r*0.3,this.y-this.r*0.3,this.r*0.1,this.x,this.y,this.r);
g.addColorStop(0,'rgba(255,255,255,'+(this.op*0.935)+')');g.addColorStop(0.35,'rgba(212,226,239,'+(this.op*0.685)+')');g.addColorStop(0.7,'rgba(174,195,215,'+(this.op*0.345)+')');g.addColorStop(1,'rgba(132,157,181,'+(this.op*0.083)+')');
c.beginPath();c.arc(this.x,this.y,this.r,0,6.283);c.fillStyle=g;c.fill();
c.beginPath();c.arc(this.x-this.r*0.268,this.y-this.r*0.318,this.r*0.179,0,6.283);c.fillStyle='rgba(255,255,255,'+(this.op*0.54)+')';c.fill();};
var drops=[],spawn=0,MAX=190;
function animate(){ctx.clearRect(0,0,W,H);spawn++;if(spawn%2===0&&drops.length<MAX)drops.push(new Drop(Math.random()*W,-20,Math.random()*3.6+1.6));for(var i=0;i<drops.length;i++){drops[i].update();drops[i].draw(ctx);}drops=drops.filter(function(d){return d.alive;});requestAnimationFrame(animate);}
animate();

// ---- 抽签逻辑 ----
var prizes=['一等奖：iPhone 16','二等奖：AirPods Pro','三等奖：100元红包','四等奖：50元优惠券','五等奖：精美周边','幸运奖：谢谢参与','特别奖：再来一次','终极大奖：神秘礼物'];
var rolling=false,ti,dc=0,hist=[];
function startDraw(){if(A.paused)ensureAudio();if(rolling)return;rolling=true;
document.getElementById('resetBtn').style.display='none';
document.getElementById('resultText').classList.add('rolling');document.getElementById('resultText').classList.remove('revealed');
var c=0,total=30+Math.floor(Math.random()*20);
ti=setInterval(function(){document.getElementById('resultText').textContent=prizes[Math.floor(Math.random()*prizes.length)];c++;if(c>=total){clearInterval(ti);reveal();}},80);}
function reveal(){var r=prizes[Math.floor(Math.random()*prizes.length)];
document.getElementById('resultText').textContent=r;document.getElementById('resultText').classList.remove('rolling');document.getElementById('resultText').classList.add('revealed');
rolling=false;document.getElementById('resetBtn').style.display='inline-block';
dc++;hist.unshift({r:r,t:new Date().toLocaleTimeString()});
document.getElementById('stats').textContent='已抽签 '+dc+' 次';document.getElementById('history').style.display='block';
document.getElementById('historyList').innerHTML=hist.map(function(it,i){return '<div class="history-item">'+(i+1)+'. '+it.r+' <small>('+it.t+')</small></div>';}).join('');}
function resetGame(){document.getElementById('resultText').textContent='轻触开始';document.getElementById('resultText').classList.remove('revealed');document.getElementById('resetBtn').style.display='none';}
var VL=[],VR=null,VC=-1;try{VL=JSON.parse(localStorage.getItem('vDraw')||'[]')}catch(e){VL=[]}
function vSave(){try{localStorage.setItem('vDraw',JSON.stringify(VL.filter(function(v){return !v.l})))}catch(e){}}
function vN(r){var s=(r||'').trim();if(!s)return null;var b=s.match(/BV[0-9A-Za-z]{10,12}/);if(b)return{n:'B站'+b[0],u:'https://player.bilibili.com/player.html?bvid='+b[0]+'&p=1&autoplay=1',f:1};var y=s.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);if(y)return{n:'YouTube'+y[1],u:'https://www.youtube.com/embed/'+y[1],f:1};return{n:s.length>36?s.slice(0,36)+'':s,u:s,f:0}}
function vR(){var b=document.getElementById('vList');if(!VL.length){b.innerHTML='<div style="font-size:.76em;color:rgba(67,91,125,.5)">列表为空</div>';return}b.innerHTML=VL.map(function(v,i){return '<div class="vwi'+(i===VC?' cur':'')+'"><span class="n" onclick="vP('+i+')">'+(i+1)+'. '+v.n+'</span><button class="d" onclick="vD('+i+')">?</button></div>'}).join('')}
function addV(){var e=document.getElementById('vUrl'),v=vN(e.value);if(!v){document.getElementById('vStatus').textContent='请先粘贴链接';return}VL.push(v);vSave();e.value='';vR();document.getElementById('vStatus').textContent='已添加：'+v.n}
function addL(i){if(!i.files||!i.files[0])return;var f=i.files[0];VL.push({n:f.name,u:URL.createObjectURL(f),f:0,l:1});i.value='';vR();document.getElementById('vStatus').textContent='已添加本地：'+f.name}
function vD(i){var v=VL[i];if(v&&v.l)try{URL.revokeObjectURL(v.u)}catch(e){}VL.splice(i,1);if(VC===i)VC=-1;else if(VC>i)VC--;vSave();vR();vC()}
function vC(){document.getElementById('vPlayer').innerHTML='<div style="color:rgba(60,85,120,.55);font-size:.88em">尚未播放</div>'}
function vP(i){if(!VL[i])return;VC=i;vR();var v=VL[i],p=document.getElementById('vPlayer');p.innerHTML=v.f?'<iframe src="'+v.u+'" allowfullscreen allow="autoplay;encrypted-media;picture-in-picture" playsinline frameborder="0"></iframe>':'<video src="'+v.u+'" controls autoplay playsinline></video>';document.getElementById('vStatus').textContent='正在播放：'+v.n}

var LAYERS=[

  {share:0.35,len:[16,30],sp:[10,15],w:1.0,a:0.32,land:0.12},

];
var WIND=0.16;
function rnd(a,b){return a+Math.random()*(b-a)}
function build(){
  drops=[];
  for(var L=0;L<LAYERS.length;L++){
    var c=LAYERS[L],num=Math.round(MAX*c.share);
    for(var i=0;i<num;i++){
      drops.push({L:L,x:rnd(-W*0.25,W),y:rnd(-H,H),len:rnd(c.len[0],c.len[1]),sp:rnd(c.sp[0],c.sp[1]),a:c.a*rnd(0.7,1.15)});

  }
}
function spawnLand(x){
  var k=3+Math.floor(Math.random()*3);
  for(var i=0;i<k;i++)splash.push({x:x,y:H-rnd(0,H*0.055),vx:rnd(-1.5,1.5),vy:rnd(-2.6,-0.9),life:1});

  if(ripples.length>90)ripples.splice(0,ripples.length-90);

function flash(){
  if(!running||hidden)return;
  function once(){if(!running)return;ctx.save();ctx.globalCompositeOperation="lighter";ctx.fillStyle="rgba(220,235,255,0.085)";ctx.fillRect(0,0,W,H);ctx.restore();

  once();lightTimer=setTimeout(function(){once();},90);
}
function scheduleFlash(){
  clearTimeout(lightTimer);
  var n=1+Math.floor(Math.random()*2);
  for(var i=0;i<n;i++)setTimeout(flash,1500+Math.random()*(CFG.dur-3500));
}
function frame(){
  if(!running||hidden)return;
  raf=requestAnimationFrame(frame);
  ctx.clearRect(0,0,W,H);
  var fog=ctx.createLinearGradient(0,0,0,H);
  fog.addColorStop(0,"rgba(158,188,214,0.050)");
  fog.addColorStop(0.55,"rgba(138,170,200,0.030)");
  fog.addColorStop(1,"rgba(120,152,184,0.038)");
  ctx.fillStyle=fog;ctx.fillRect(0,0,W,H);
  ctx.lineCap="round";
  for(var i=0;i<drops.length;i++){
    var d=drops[i],c=LAYERS[d.L];
    d.y+=d.sp;d.x+=d.sp*WIND;
    if(d.y>H+8||d.x>W+30){
      d.y=rnd(-H*0.4,-10);d.x=rnd(-W*0.25,W);
      if(Math.random()<c.land)spawnLand(Math.min(W,Math.max(0,d.x)));
    }
    ctx.strokeStyle="rgba(198,220,240,"+d.a.toFixed(3)+")";
    ctx.lineWidth=c.w;
    ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.len*WIND,d.y-d.len);ctx.stroke();
    if(d.L===2){
      ctx.strokeStyle="rgba(235,246,255,"+(d.a*0.55).toFixed(3)+")";
      ctx.lineWidth=0.7;
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.len*WIND*0.45,d.y-d.len*0.45);ctx.stroke();
    }
  }
  for(var j=splash.length-1;j>=0;j--){
    var s=splash[j];s.x+=s.vx;s.y+=s.vy;s.vy+=0.16;s.life-=0.045;
    if(s.life<=0){splash.splice(j,1);continue}
    ctx.fillStyle="rgba(214,232,248,"+(s.life*0.55).toFixed(3)+")";
    ctx.fillRect(s.x,s.y,1.6,1.6);
  }
  for(var k=ripples.length-1;k>=0;k--){
    var r=ripples[k];r.r+=1.5;r.life-=0.036;
    if(r.life<=0){ripples.splice(k,1);continue}
    ctx.strokeStyle="rgba(206,228,246,"+(r.life*0.32).toFixed(3)+")";
    ctx.lineWidth=0.9;
    ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*0.28,0,0,Math.PI*2);ctx.stroke();
  }
}
function fadeTo(node,target,ms,done){
  var steps=Math.max(1,Math.round(ms/50)),i=0,from=node.volume;
  var key=(node===au)?"auFade":"aFade";
  clearInterval(window[key]);
  window[key]=setInterval(function(){
    i++;node.volume=Math.max(0,Math.min(1,from+(target-from)*i/steps));
    if(i>=steps){clearInterval(window[key]);if(done)done();}
  },50);
}

}

  clearTimeout(lightTimer);clearTimeout(endTimer);cancelAnimationFrame(raf);
  cv.style.opacity="0";

<script id="destroy-js">
(function(){
if(window.__destroyAnim)return;window.__destroyAnim=1;
var W=innerWidth,H=innerHeight;
function rnd(a,b){return a+Math.random()*(b-a);}
var G=null,NATIVE=false;
function makeMini(){
  var tw=[],raf=null;
  var E={none:function(t){return t},linear:function(t){return t},
    'power2.inOut':function(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2},
    'power2.out':function(t){return 1-Math.pow(1-t,2)},
    'power3.in':function(t){return t*t*t},
    'sine.inOut':function(t){return -(Math.cos(Math.PI*t)-1)/2}};
  function ens(el){if(el&&el.nodeType===1&&el.style&&!el.__d){var o=1;try{o=parseFloat(getComputedStyle(el).opacity);if(isNaN(o))o=1;}catch(e){}el.__d={x:0,y:0,rotation:0,scaleX:1,scaleY:1,skewX:0,opacity:o};}}
  function app(el){var s=el.__d;if(!s)return;el.style.transform='translate('+s.x+'px,'+s.y+'px) rotate('+s.rotation+'deg) skewX('+s.skewX+'deg) scale('+s.scaleX+','+s.scaleY+')';el.style.opacity=s.opacity;}
  function step(){
    raf=null;
    for(var i=0;i<tw.length;i++){
      var w=tw[i];
      if(w.dead)continue;
      if(w.delay>0){w.delay-=1/60;continue;}
      w.t+=1/60;
      var p=Math.min(1,w.t/w.dur),v=(E[w.ease]||E.none)(p);
      for(var k in w.to){w.base[k]=w.from[k]+(w.to[k]-w.from[k])*v;}
      if(w.dom)app(w.obj);
      if(w.up){try{w.up();}catch(e){}}
      if(p>=1){
        if(w.cb){try{w.cb();}catch(e){}}
        if(w.rep>0){w.rep--;w.t=0;if(w.yo){var a=w.from;w.from=w.to;w.to=a;}}
        else w.dead=true;
      }
    }
    tw=tw.filter(function(w){return !w.dead;});
    if(tw.length)raf=requestAnimationFrame(step);
  }
  function to(obj,vars){
    if(vars.scale!==undefined){vars.scaleX=vars.scale;vars.scaleY=vars.scale;delete vars.scale;}
    var dom=!!(obj&&obj.nodeType===1&&obj.style);
    if(dom)ens(obj);
    var base=dom?obj.__d:obj,from={},t2={};
    for(var k in vars){
      if(k==='duration'||k==='delay'||k==='ease'||k==='onComplete'||k==='repeat'||k==='yoyo')continue;
      var v=vars[k],cur=(base[k]===undefined?0:base[k]);
      if(typeof v==='string'&&v.indexOf('+=')===0){t2[k]=cur+parseFloat(v.slice(2));from[k]=cur;}
      else{t2[k]=v;from[k]=cur;}
    }
    var w={obj:obj,dom:dom,base:base,from:from,to:t2,t:0,dur:Math.max(.001,vars.duration||.5),delay:vars.delay||0,ease:vars.ease||'none',cb:vars.onComplete,up:vars.onUpdate,rep:(vars.repeat===undefined?0:(vars.repeat<0?99999:vars.repeat)),yo:!!vars.yoyo,dead:false};
    tw.push(w);
    if(!raf)raf=requestAnimationFrame(step);
    return w;
  }
  function kill(obj){for(var i=0;i<tw.length;i++){if(tw[i].obj===obj)tw[i].dead=true;}}
  return {to:to,killTweensOf:kill};
}

var RW=0,RH=0,RDPR=1;
var RAIN={intensity:0,wind:0.06,running:false,raf:0,drops:[],splash:[],ripples:[],MAX:900};
var RL=[{share:.45,len:[8,16],sp:[7,11],w:.6,a:.20,land:.05},
        {share:.35,len:[16,30],sp:[12,17],w:1.0,a:.34,land:.14},

function rresize(){
  RW=innerWidth;RH=innerHeight;RDPR=Math.min(devicePixelRatio||1,2);
  RCV.width=Math.floor(RW*RDPR);RCV.height=Math.floor(RH*RDPR);

function rbuild(){
  RAIN.drops=[];
  for(var L=0;L<RL.length;L++){
    var c=RL[L],n=Math.round(RAIN.MAX*c.share);
    for(var i=0;i<n;i++)RAIN.drops.push({L:L,x:rnd(-RW*.3,RW),y:rnd(-RH,RH),len:rnd(c.len[0],c.len[1]),sp:rnd(c.sp[0],c.sp[1]),a:c.a*rnd(.7,1.15)});
  }
}
function rsplash(x){
  var k=2+Math.floor(Math.random()*3);
  for(var i=0;i<k;i++)RAIN.splash.push({x:x,y:RH-rnd(0,RH*.05),vx:rnd(-1.6,1.6),vy:rnd(-2.8,-1.0),life:1});

  if(RAIN.ripples.length>100)RAIN.ripples.splice(0,RAIN.ripples.length-100);

function rframe(){
  if(!RAIN.running)return;

  RX.lineCap='round';
  var vis=Math.max(30,Math.round(RAIN.drops.length*(.15+.85*fi)));
  for(var i=0;i<vis;i++){
    var d=RAIN.drops[i],c=RL[d.L];
    d.y+=d.sp*(.5+fi*.9);d.x+=d.sp*RAIN.wind*(.6+fi*.8);

    var sp=RAIN.splash[j];sp.x+=sp.vx;sp.y+=sp.vy;sp.vy+=.17;sp.life-=.045;
    if(sp.life<=0){RAIN.splash.splice(j,1);continue;}

    RX.lineWidth=.9;
    RX.beginPath();RX.ellipse(r.x,r.y,r.r,r.r*.28,0,0,Math.PI*2);RX.stroke();

var shakeTargets=[];
function doShake(px,ms){
  var t0=performance.now();
  (function tick(){
    var e=performance.now()-t0;
    if(e>ms){shakeTargets.forEach(function(el){if(el.__sx!==undefined){el.style.transform=el.__sx;delete el.__sx;}});shakeTargets=[];return;}
    var k=1-e/ms,amp=px*k;
    shakeTargets.forEach(function(el){
      if(el.__sx===undefined)el.__sx=el.style.transform||'';
      el.style.transform=el.__sx+' translate('+rnd(-amp,amp)+'px,'+rnd(-amp,amp)+'px)';
    });
    requestAnimationFrame(tick);
  })();
}
function flashStrike(power){

}

// Web Audio: 风 + 雷 + 雨声增益
var AC=null,WND=null,WNDG=null,RAINAMP=null;
function audioCtx(){
  if(AC)return AC;
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  AC=new C();
  return AC;
}
function startWind(){
  var c=audioCtx();if(!c)return;
  if(WND)return;
  var len=c.sampleRate*4,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  var last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
  var src=c.createBufferSource();src.buffer=buf;src.loop=true;
  var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.Q.value=.6;
  var g=c.createGain();g.gain.value=0;
  src.connect(lp);lp.connect(g);g.connect(c.destination);
  src.start();
  WND=src;WNDG=g;RAINAMP=lp;
}
function setWind(v){
  if(!WNDG)return;
  WNDG.gain.setTargetAtTime(Math.max(0,Math.min(.5,v)),AC.currentTime,.25);
  if(RAINAMP)RAINAMP.frequency.setTargetAtTime(280+900*v,AC.currentTime,.3);
}
function thunder(power){
  var c=audioCtx();if(!c)return;
  var dur=1.6+Math.random()*1.2,len=Math.floor(c.sampleRate*dur);
  var buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  var lp=0;
  for(var i=0;i<len;i++){
    var env=Math.exp(-i/(c.sampleRate*.35));
    var w=(Math.random()*2-1)*env;
    lp=lp*.985+w*.015;
    d[i]=lp*3.2*env;
  }
  var src=c.createBufferSource();src.buffer=buf;
  var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=220;
  var g=c.createGain();g.gain.value=.55*power;
  src.connect(f);f.connect(g);g.connect(c.destination);
  src.start();
}

var FW=0,FH=0,FDPR=1,FRAG=[],FRAG_MAX=800,FRAG_RAF=0,FRAG_RUN=false;
var PALETTE=['rgba(245,248,252,.95)','rgba(226,236,246,.95)','rgba(200,218,236,.95)','rgba(174,195,215,.95)','rgba(140,166,196,.95)','rgba(255,255,255,.9)'];

function spawnFrags(cx,cy,w,h,count){
  count=count||8;
  var n=Math.min(count,FRAG_MAX-FRAG.length);
  for(var i=0;i<n;i++){
    var size=rnd(6,18);
    var px=cx+rnd(-Math.min(w,300)/2, Math.min(w,300)/2);
    var py=cy+rnd(-40,10);
    px=Math.max(10, Math.min(FW-10, px));
    py=Math.max(10, Math.min(FH-10, py));
    FRAG.push({
      x:px, y:py,
      vx:rnd(-4,4), vy:rnd(-6,-1.5),
      g:.22+Math.random()*.12,
      rot:rnd(0,Math.PI*2), vr:rnd(-.18,.18),
      sw:size, sh:size*rnd(.5,1.3),
      life:1, decay:.004+Math.random()*.003,
      color:PALETTE[Math.floor(Math.random()*PALETTE.length)]
    });
  }
}
function fragFrame(){
  if(!FRAG_RUN)return;
  FRAG_RAF=requestAnimationFrame(fragFrame);
  FX.clearRect(0,0,FW,FH);
  for(var i=0;i<FRAG.length;i++){
    var p=FRAG[i];
    if(!p.rest){
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      p.vx*=.988;
      var floor=FH-rnd(0,10)-p.sh*.5;
      if(p.y>=floor){p.y=floor;p.vy*=-.28;p.vx*=.7;p.vr*=.6;if(Math.abs(p.vy)<.6){p.rest=true;}}
    }
    FX.save();FX.translate(p.x,p.y);FX.rotate(p.rot);
    FX.fillStyle=p.color;
    FX.fillRect(-p.sw/2,-p.sh/2,p.sw,p.sh);
    FX.strokeStyle='rgba(255,255,255,.45)';
    FX.lineWidth=1;
    FX.strokeRect(-p.sw/2,-p.sh/2,p.sw,p.sh);
    FX.restore();
  }
}

function startLightning(intensity){

function launch(){

function timeline(){
  var targets=collectTargets();
  var panel=document.querySelector('.glass-panel');
  var sb=document.getElementById('soundBar');
  var fe=document.getElementById('fishEgg');

  // ---------- 0-3s：雨势拉满 ----------
  var RAIN_IN={v:0};
  G.to(RAIN_IN,{v:1,duration:3,ease:'power2.inOut',onUpdate:function(){
    RAIN.intensity=RAIN_IN.v;
    RAIN.wind=.06+.28*RAIN_IN.v;
    try{RN.volume=Math.max(0,Math.min(1,.85*RAIN_IN.v));}catch(e){}
    setWind(.12+.42*RAIN_IN.v);
  }});
  startLightning(.3);

  // ---------- 3-18s：狂风卷乱 ----------
  var chaosTargets=[];
  targets.forEach(function(el,i){
    var r=el.getBoundingClientRect();
    el.__rect={x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};
    chaosTargets.push(el);
    var delay=3+Math.random()*4;
    var dur=9+Math.random()*4;
    var cx=r.left+r.width/2, cy=r.top+r.height/2;
    var nx=(innerWidth/2-cx)*0.9+rnd(-180,180);
    var ny=(innerHeight/2-cy)*0.6+rnd(-220,80);
    G.to(el,{
      x:'+='+nx.toFixed(1), y:'+='+ny.toFixed(1),
      rotation:rnd(-720,720), skewX:rnd(-28,28),
      scaleX:rnd(.6,1.35), scaleY:rnd(.5,1.25),
      duration:dur, delay:delay, ease:'sine.inOut'
    });
    // 二次拉扯往复，制造持续卷动
    G.to(el,{
      x:'+='+rnd(-140,140).toFixed(1), y:'+='+rnd(-120,120).toFixed(1),
      rotation:'+='+rnd(-360,360), skewX:rnd(-22,22),
      scaleX:rnd(.7,1.25), scaleY:rnd(.6,1.2),
      duration:6+Math.random()*3, delay:delay+dur*0.5, ease:'sine.inOut', repeat:0
    });
  });
  __dEls=chaosTargets;
  // 3-18秒期间闪电加强、风噪拉满
  var W2={v:0};
  G.to(W2,{v:1,duration:15,ease:'none',delay:3,onUpdate:function(){
    setWind(.54+W2.v*.2);
  }});
  startLightning(1);

  // ---------- 18-25s：坠落 + 碎裂 ----------
  chaosTargets.forEach(function(el,i){
    var delay=18+Math.random()*2.5;
    var rect=el.__rect||{x:innerWidth/2,y:innerHeight/2,w:60,h:40};
    G.to(el,{
      y:(innerHeight-40-rect.y).toFixed(1),
      x:rnd(-innerWidth*0.35, innerWidth*0.35),
      rotation:'+='+rnd(-200,200),
      scaleX:.9, scaleY:.9,
      duration:2.6+Math.random()*1.4, delay:delay, ease:'power3.in',
      onComplete:(function(el){
        return function(){
          var curRect=el.getBoundingClientRect();
          el.style.visibility='hidden';
          var cnt=8+Math.floor(Math.random()*6);
          spawnFrags(curRect.left+curRect.width/2, innerHeight-20, curRect.width, 80, cnt);
        };
      })(el)
    });
  });

  // ---------- 25-30s：镜头聚焦大肥鱼 ----------
  var FISH_EL=document.querySelector('#fishEgg .fishBodyImg')||document.querySelector('.fishBodyImg');
  var fishWrap=document.getElementById('fishEgg');
  var FISH_CLONE=null;
  if(FISH_EL){
    if(!FISH_CLONE&&fishWrap){FISH_EL=fishWrap;}
    var fr=FISH_EL.getBoundingClientRect();
    FISH_CLONE=FISH_EL.cloneNode(true);
    FISH_CLONE.style.cssText='position:fixed;left:'+fr.left+'px;top:'+fr.top+'px;width:'+fr.width+'px;height:'+fr.height+'px;z-index:10000;pointer-events:none;transform-origin:center center;';
    FISH_CLONE.id='fishFocusClone';
    document.body.appendChild(FISH_CLONE);
    // 让原 fishEgg 保持可见但被 clone 覆盖，隐藏原元素避免双影
    if(fishWrap)fishWrap.style.visibility='hidden';
    var tw=fr.width, th=fr.height;
    var targetScale=Math.min(innerWidth*.5/tw, innerHeight*.5/th);
    var dx=innerWidth/2-(fr.left+fr.width/2);
    var dy=innerHeight/2-(fr.top+fr.height/2);
    G.to(FISH_CLONE,{
      x:dx, y:dy, scale:targetScale,
      duration:4.2, delay:25, ease:'power2.inOut'
    });
    G.to(FISH_CLONE,{rotation:0,duration:4,delay:25,ease:'sine.inOut'});
  }

  // ---------- 收尾：停在结尾画面 ----------
  var idEnd=setTimeout(function(){
    // 30秒结束：清闪电（保留雨），停止按钮已禁用
    clearLights();
    // 保留一定强度雨 + 低风
    RAIN.intensity=1;RAIN.wind=.28;
    try{RN.volume=.7;}catch(e){}
    setWind(.35);
    // 每 3-6 秒偶发闪电，保持"停在结尾"但有气氛（可选）
    (function loopLight(){
      if(!started)return;
      var t=setTimeout(function(){
        flashStrike(rnd(.5,.9));
        loopLight();
      },rnd(3000,6500));
      LT.push(t);
    })();
  },30000);
  LT.push(idEnd);

  var idHand=setTimeout(function(){
    if(typeof window.__repairStart==='function'){
      try{window.__repairStart();}catch(e){}
    }
  },31200);
}

    started=false;

};

IMG_FS.style.cssText='display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;cursor:pointer;';
RCARD.appendChild(IMG_FS);

var RBAR=document.createElement('div');
RBAR.style.cssText='position:relative;width:100%;height:15px;border-radius:8px;background:rgba(16,28,46,.88);box-shadow:inset 0 0 0 1px rgba(120,175,235,.35),0 6px 20px rgba(0,0,0,.45);overflow:hidden;opacity:0;transition:opacity .6s;';
RSTAGE.appendChild(RBAR);

var RFILL=document.createElement('div');
RFILL.style.cssText='position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#3f7fd0,#68c7ff,#a8e6ff);box-shadow:0 0 16px rgba(104,199,255,.9);';
RBAR.appendChild(RFILL);

var RTXT=document.createElement('div');
RTXT.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#eaf6ff;letter-spacing:1px;font-weight:bold;text-shadow:0 0 6px rgba(0,0,0,.9);';
RTXT.textContent='0%';
RBAR.appendChild(RTXT);

var RHINT=document.createElement('div');
RHINT.style.cssText='height:18px;font-size:13px;color:#9fc4ea;letter-spacing:1px;opacity:0;transition:opacity .5s;text-align:center;white-space:nowrap;';
RSTAGE.appendChild(RHINT);

function rpmSize(which){
  var w,h;
  if(which==='pu'){
    w=Math.min(innerWidth*0.78,820);
    h=w*506/900;
  }else{
    var s=Math.min(innerHeight*0.60,innerWidth*0.62,480);
    w=s;h=s;
  }
  return {w:Math.round(w),h:Math.round(h)};
}
function setProg(v){
  RPM.prog=v;
  RFILL.style.width=v+'%';
  RTXT.textContent=(v>=99.95?100:Math.floor(v))+'%';
}
function animProg(from,to,dur,done){
  var t0=performance.now();
  function step(){
    var p=Math.min(1,(performance.now()-t0)/dur);
    var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    setProg(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);
    else if(done)done();
  }
  requestAnimationFrame(step);
}
function glitchReveal(dur,done){
  RCARD.style.opacity='0';
  var t0=performance.now();
  function step(){
    var p=Math.min(1,(performance.now()-t0)/dur);
    var op=p<0.15?p*3:(p<0.45?0.45+(p-0.15)*1.1:0.78+(p-0.45)*0.4);
    RCARD.style.opacity=Math.min(1,op).toFixed(3);
    var amp=(1-p)*(1-p)*18;
    IMG_PU.style.transform='translateX('+((Math.random()*2-1)*amp).toFixed(1)+'px) skewX('+((Math.random()*2-1)*amp*0.4).toFixed(1)+'deg)';
    IMG_PU.style.filter='brightness('+(1+(1-p)*1.0).toFixed(2)+') hue-rotate('+(Math.sin(p*25)*45*(1-p)).toFixed(0)+'deg) contrast('+(1+(1-p)*0.5).toFixed(2)+')';
    if(p<1)requestAnimationFrame(step);
    else{RCARD.style.opacity='1';IMG_PU.style.transform='';IMG_PU.style.filter='';if(done)done();}
  }
  requestAnimationFrame(step);
}
function popRice(e){
  var x=e?e.clientX:innerWidth/2;
  var y=e?e.clientY:innerHeight/2;
  var d=document.createElement('div');
  d.textContent='白饭+1';
  d.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;z-index:10060;pointer-events:none;color:#fff;font-size:24px;font-weight:bold;letter-spacing:2px;font-family:"Microsoft YaHei",sans-serif;text-shadow:0 0 14px rgba(120,200,255,.95),0 2px 10px rgba(0,0,0,.85);transform:translate(-50%,-50%);opacity:1;transition:transform 1s cubic-bezier(.22,1,.36,1),opacity 1s;';
  document.body.appendChild(d);
  requestAnimationFrame(function(){
    d.style.transform='translate(-50%,-50%) translateY(-90px) scale(1.25)';
    d.style.opacity='0';
  });
  setTimeout(function(){d.remove();},1100);
}
function repairStart(){
  if(RPM.on)return;
  RPM.on=true;RPM.clicks=0;RPM.phase=0;
  setProg(0);
  RFILL.style.width='0%';RTXT.textContent='0%';
  var z=rpmSize('pu');
  RCARD.style.width=z.w+'px';
  RCARD.style.height=z.h+'px';
  IMG_PU.style.display='block';
  IMG_FS.style.display='none';
  RBAR.style.opacity='0';
  RHINT.style.opacity='0';
  RHINT.textContent='';
  ROV.style.display='block';
  ROV.style.opacity='0';

  ROV.style.opacity='1';

  setTimeout(function(){
    glitchReveal(2600,function(){
      RBAR.style.opacity='1';
      RHINT.textContent='正在修复 · 请稍候';
      RHINT.style.opacity='1';
      animProg(0,95,11000,function(){
        repairSwap();
      });
    });
  },800);
}

function repairSwap(){
  RPM.phase=1;
  RHINT.textContent='检测到异常 · 正在替换核心模块...';
  var t0=performance.now(),dur=1100;
  function step(){
    var p=Math.min(1,(performance.now()-t0)/dur);
    var amp=Math.sin(p*Math.PI)*16;
    IMG_PU.style.transform='translate('+((Math.random()*2-1)*amp).toFixed(1)+'px,'+((Math.random()*2-1)*amp*0.5).toFixed(1)+'px)';
    IMG_PU.style.filter='brightness('+(1+Math.sin(p*Math.PI)*0.8).toFixed(2)+') hue-rotate('+(p*360).toFixed(0)+'deg) saturate('+(1+Math.sin(p*Math.PI)*2).toFixed(2)+')';
    IMG_PU.style.opacity=(1-p*0.9).toFixed(3);
    if(p<1)requestAnimationFrame(step);
    else{
      IMG_PU.style.display='none';
      IMG_PU.style.transform='';IMG_PU.style.filter='';IMG_PU.style.opacity='1';
      var z=rpmSize('fish');
      RCARD.style.width=z.w+'px';
      RCARD.style.height=z.h+'px';
      IMG_FS.style.display='block';
      IMG_FS.style.opacity='0';
      setTimeout(function(){
        IMG_FS.style.transition='opacity .55s,filter .55s';
        IMG_FS.style.filter='brightness(1.9) hue-rotate(80deg)';
        IMG_FS.style.opacity='1';
        setTimeout(function(){
          IMG_FS.style.filter='';
          repairReady();
        },560);
      },320);
    }
  }
  requestAnimationFrame(step);
}

function repairReady(){
  RPM.phase=2;
  RHINT.textContent='模块已就位 · 点击小肥鱼投喂白饭（0/5）';
  RHINT.style.opacity='1';
  IMG_FS.style.cursor='pointer';
  IMG_FS.onclick=function(e){
    if(RPM.phase!==2)return;
    e.stopPropagation();
    popRice(e);
    RPM.clicks++;
    if(RPM.clicks>=5){
      RHINT.textContent='投喂完成 · 正在补全修复进度...';
      RPM.phase=3;
      IMG_FS.onclick=null;
      animProg(95,100,1400,function(){
        setTimeout(repairFinish,700);
      });
    }else{
      RHINT.textContent='模块已就位 · 点击小肥鱼投喂白饭（'+RPM.clicks+'/5）';
    }
  };
}

function repairFinish(){
  RPM.phase=4;
  RHINT.textContent='修复完成 · 正在恢复界面...';
  setTimeout(function(){
    ROV.style.transition='opacity 1.2s';
    ROV.style.opacity='0';
    setTimeout(function(){
      ROV.style.display='none';
      RPM.on=false;RPM.clicks=0;RPM.phase=0;
      var b=document.getElementById('destroyBtn');
      if(b){
        var rem=(window.__destroyCdEnd||0)-Date.now();
        if(rem>0){
          b.disabled=true;b.style.opacity='.5';b.style.cursor='default';
          (function tick(){
            var r=(window.__destroyCdEnd||0)-Date.now();
            if(r>0){b.textContent='冷却 '+Math.ceil(r/1000)+'s';setTimeout(tick,200);}
            else{b.disabled=false;b.style.opacity='1';b.style.cursor='pointer';b.textContent='点击摧毁';}
          })();
        }else{
          b.disabled=false;b.style.opacity='1';b.style.cursor='pointer';b.textContent='点击摧毁';
        }
      }
      if(typeof window.__destroyRestore==='function'){try{window.__destroyRestore();}catch(e){}}
    },1200);
  },400);
}

window.__repairStart=repairStart;
</script>

</body>
</html>
