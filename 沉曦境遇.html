<style id="fs-css">
#fsBtn{position:fixed;right:8px;top:8px;z-index:99999;display:none;padding:6px 13px;font-size:12px;font-weight:800;letter-spacing:1px;color:#04101f;background:linear-gradient(135deg,#7ee0ff,#5b8cff);border:1.5px solid rgba(255,255,255,.85);border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 16px rgba(100,220,255,.8),inset 0 1px 0 rgba(255,255,255,.5);cursor:pointer;transition:opacity .5s,transform .15s;user-select:none;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 2px rgba(255,255,255,.4)}

<script id="fs-js">
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function enterFS(){
  var el=document.documentElement;
  try{
    if(el.requestFullscreen){var p=el.requestFullscreen();if(p&&p.catch)p.catch(function(){});}
    else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();}
  }catch(e){}
  try{
    if(screen.orientation&&screen.orientation.lock){var q=screen.orientation.lock('portrait');if(q&&q.catch)q.catch(function(){});}
  }catch(e){}
}
function exitFS(){
  try{
    if(document.exitFullscreen){var p=document.exitFullscreen();if(p&&p.catch)p.catch(function(){});}
    else if(document.webkitExitFullscreen){document.webkitExitFullscreen();}
  }catch(e){}
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
}
function updateFSBtn(){
  var b=document.getElementById('fsBtn');if(!b)return;
  b.textContent=isFS()?'\u9000\u51FA\u5168\u5C4F':'\u5168\u5C4F';
}
var _fsTimer=null;
function showFSBtn(){
  var b=document.getElementById('fsBtn');if(!b)return;
  updateFSBtn();
  b.classList.add('on');b.classList.remove('dim');
  if(_fsTimer)clearTimeout(_fsTimer);
  _fsTimer=setTimeout(function(){b.classList.add('dim');},2000);
}
function toggleFS(){
  if(isFS())exitFS();else enterFS();
  showFSBtn();
}
function bindFS(){
  var b=document.getElementById('fsBtn');if(!b||b.__bound)return;b.__bound=1;
  b.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();toggleFS();});
  b.addEventListener('touchstart',function(e){e.stopPropagation();e.preventDefault();toggleFS();},{passive:false});
  function onChange(){updateFSBtn();showFSBtn();}
  document.addEventListener('fullscreenchange',onChange);
  document.addEventListener('webkitfullscreenchange',onChange);
  /* 触摸/点击屏幕时重新显示按钮 */
  document.addEventListener('touchstart',function(){if(isFS())showFSBtn();},{passive:true});
  document.addEventListener('mousedown',function(){if(isFS())showFSBtn();});
}
</script>

<canvas id="game"></canvas>
<div id="hud">

  </div>

<div id="overlay">
  <h1>沉曦境遇</h1>
  <p>曦沉之境，执念在此回响。<br>移动躲避，武器自动索敌。<br>升级三选一，活到最后，击败曦沉执境。</p>
  <button id="startBtn">开始</button>
</div>
<script>const cv=document.getElementById('game'),cx=cv.getContext('2d');
let DPR=Math.min(window.devicePixelRatio||1,2),VW=0,VH=0;
function resize(){VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;cv.style.width=VW+'px';cv.style.height=VH+'px';cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;};
function distToSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;if(l2===0)return Math.hypot(px-x1,py-y1);let tt=((px-x1)*dx+(py-y1)*dy)/l2;tt=tt<0?0:(tt>1?1:tt);const cxp=x1+tt*dx,cyp=y1+tt*dy;return Math.hypot(px-cxp,py-cyp);}
const TAU=Math.PI*2;
/* ===== 音效引擎（Web Audio 程序合成） ===== */
const SFX={
  ctx:null,master:null,ready:false,_ls:0,_lh:0,
  init(){
    if(this.ready)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.4;
      this.master.connect(this.ctx.destination);
      this.ready=true;
    }catch(e){}
  },
  resume(){try{if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}catch(e){}},
  tone(freq,dur,type,vol,slideTo,delay){
    if(!this.ready)return;
    try{
      const t0=this.ctx.currentTime+(delay||0);
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=type||'sine';
      o.frequency.setValueAtTime(freq,t0);
      if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t0+dur);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(vol||0.15,t0+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g);g.connect(this.master);
      o.start(t0);o.stop(t0+dur+0.03);
    }catch(e){}
  },
  noise(dur,vol,filterFreq,delay){
    if(!this.ready)return;
    try{
      const t0=this.ctx.currentTime+(delay||0);
      const len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
      const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
      const src=this.ctx.createBufferSource();src.buffer=buf;
      const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=filterFreq||2000;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(vol||0.15,t0);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      src.connect(f);f.connect(g);g.connect(this.master);
      src.start(t0);
    }catch(e){}
  },
  shoot(){
    const n=performance.now();if(n-this._ls<45)return;this._ls=n;
    this.tone(760+rnd(-70,70),0.055,'square',0.045,380);
  },
  hit(){
    const n=performance.now();if(n-this._lh<40)return;this._lh=n;
    this.tone(240,0.05,'triangle',0.06,150);
  },
  kill(isBig){
    if(isBig){this.noise(0.3,0.26,900);this.tone(90,0.3,'sawtooth',0.14,40);}
    else{this.noise(0.11,0.12,2400);}
  },
  hurt(){this.tone(190,0.26,'sawtooth',0.2,58);this.noise(0.14,0.16,600);},
  levelup(){[523,659,784].forEach((f,i)=>this.tone(f,0.17,'sine',0.13,null,i*0.07));},
  pick(){this.tone(1046,0.09,'sine',0.14,1568);this.tone(1568,0.07,'sine',0.07,null,0.05);},
  bossSpawn(){this.tone(62,1.2,'sawtooth',0.24,38);this.tone(124,1.0,'sine',0.13,78,0.1);this.noise(0.8,0.2,420);},
  bossShot(){this.tone(145,0.11,'square',0.075,92);},
  crystal(){this.tone(880,0.11,'sine',0.14,1760);this.tone(1320,0.09,'sine',0.09,null,0.055);},
  win(){[523,659,784,1046].forEach((f,i)=>this.tone(f,0.45,'sine',0.16,null,i*0.12));},
  lose(){[440,330,247,165].forEach((f,i)=>this.tone(f,0.38,'triangle',0.14,null,i*0.14));},
  laserCharge(){this.tone(160,2.9,'sawtooth',0.11,720);this.tone(240,2.9,'sine',0.07,1080,0.05);},
  laserFire(){this.noise(0.5,0.3,1600);this.tone(85,0.5,'sawtooth',0.22,55);this.tone(170,0.4,'square',0.1,110,0.05);}
};const keys={};window.keys=keys;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const cam={x:0,y:0,shake:0,shakeX:0,shakeY:0};
function camUpdate(){cam.shake*=0.9;if(cam.shake<0.05)cam.shake=0;cam.shakeX=rnd(-cam.shake,cam.shake);cam.shakeY=rnd(-cam.shake,cam.shake);}
function addShake(v){cam.shake=Math.min(cam.shake+v,40);}
const parts=[];
function spawnPart(o){
  if(parts.length>800)parts.shift();
  parts.push({x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,life:o.life||0.6,max:o.life||0.6,size:o.size||3,grav:o.grav||0,drag:o.drag??0.98,color:o.color||'#7ee0ff',glow:o.glow!==false,shape:o.shape||'circle',rot:o.rot||0,vr:o.vr||0,add:o.add!==false});
}
function burst(x,y,n,opt={}){
  const col=opt.color||'#7ee0ff',spd=opt.spd||220,size=opt.size||3,life=opt.life||0.6;
  for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(spd*0.2,spd);spawnPart({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life*0.5,life),size:rnd(size*0.5,size),color:col,grav:opt.grav||0,drag:opt.drag??0.94,shape:opt.shape,add:opt.add});}
}
function ring(x,y,opt={}){spawnPart({x,y,life:opt.life||0.4,size:opt.size||6,color:opt.color||'#fff',shape:'ring',add:true,vr:0});}
const texts=[];
function floatText(x,y,str,color='#ffd23d',size=18){texts.push({x,y,str,color,size,life:0.9,max:0.9,vy:-60,vx:rnd(-20,20)});}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.vy+=p.grav*dt;p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;if(t.life<=0){texts.splice(i,1);continue;}t.x+=t.vx*dt;t.y+=t.vy*dt;t.vy*=0.96;}
}
function drawParts(){
  cx.save();cx.globalCompositeOperation='lighter';
  for(const p of parts){
    const k=p.life/p.max;cx.globalAlpha=clamp(k,0,1);
    /* shadowBlur已移除，靠lighter混合发光 */
    if(p.shape==='ring'){cx.strokeStyle=p.color;cx.lineWidth=Math.max(1,p.size*0.5*k);cx.beginPath();cx.arc(p.x-cam.x+VW/2,p.y-cam.y+VH/2,p.size*(1-k)*6+2,0,TAU);cx.stroke();}
    else if(p.shape==='square'){cx.fillStyle=p.color;cx.save();cx.translate(p.x-cam.x+VW/2,p.y-cam.y+VH/2);cx.rotate(p.rot);cx.fillRect(-p.size/2,-p.size/2,p.size,p.size);cx.restore();}
    else{cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x-cam.x+VW/2,p.y-cam.y+VH/2,p.size*k+0.4,0,TAU);cx.fill();}
  }
  cx.restore();

}function bossUpdate(b,dt){

function update(dt){

  if(keys['w']||keys['arrowup'])my--;
  if(keys['s']||keys['arrowdown'])my++;
  if(keys['a']||keys['arrowleft'])mx--;
  if(keys['d']||keys['arrowright'])mx++;
  if(mx||my){const l=Math.hypot(mx,my);mx/=l;my/=l;}
  P.vx+=mx*P.speed*10*dt;P.vy+=my*P.speed*10*dt;P.vx*=0.82;P.vy*=0.82;
  const v=Math.hypot(P.vx,P.vy);if(v>P.speed){P.vx=P.vx/v*P.speed;P.vy=P.vy/v*P.speed;}
  P.x+=P.vx*dt;P.y+=P.vy*dt;

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.life-=dt;b.trail.push({x:b.x,y:b.y});if(b.trail.length>6)b.trail.shift();
    b.x+=b.vx*dt;b.y+=b.vy*dt;

    let hitSomething=false;
    for(const e of enemies){
      if(e.dead||b.hit.has(e))continue;
      if(dist2(b,e)<(b.r+e.r)*(b.r+e.r)){b.hit.add(e);damageEnemy(e,b.dmg);if(P.vamp>0&&P.hp<P.maxHp){P.hp=Math.min(P.maxHp,P.hp+b.dmg*P.vamp);}if(P.chain>0)chainLightning(e,b.dmg*0.5,P.chain);burst(b.x,b.y,6,{color:'#7ee0ff',spd:140,size:2.4,life:0.3});if(b.hit.size>b.pierce){hitSomething=true;break;}}

          floatText(bb.x+rnd(-20,20),bb.y-bb.r-20,'+'+Math.round(heal),'#ff7b9c',20);

      cx.strokeStyle='rgba(255,45,85,'+(0.32*(1-wp))+')';
      cx.lineWidth=2.5;
      cx.beginPath();cx.arc(p.x,cy,wr,0,TAU2);cx.stroke();
    }
    /* 旋转尖刺环：满血3层，中血2层，残血1层 */
    const layers=hk>0.66?3:1;
    for(let L=0;L<layers;L++){
      const spin=t*(0.7+L*0.35)*(L%2?-1:1)+ph;
      const n=8+L*3;
      const rr=r*(0.95+L*0.22)*pulse;
      cx.strokeStyle=flash?'#fff':(L===0?dangerC:'rgba(255,120,60,'+(0.5-L*0.12)+')');
      cx.lineWidth=2+L*0.4;
      for(let i=0;i<n;i++){
        const a=spin+i/n*TAU2;
        const len=rr*(1+0.34*Math.abs(Math.sin(t*2+i)));
        cx.beginPath();
        cx.moveTo(p.x+Math.cos(a)*rr,cy+Math.sin(a)*rr);
        cx.lineTo(p.x+Math.cos(a)*len,cy+Math.sin(a)*len);
        cx.stroke();
      }
    }
    cx.globalCompositeOperation='source-over';
    /* 触手冠：满血6条狂舞，中血4条，残血2条 */
    const tent=hk>0.66?6:2;
    cx.strokeStyle=flash?'#fff':'rgba(255,45,85,0.75)';
    cx.lineWidth=Math.max(2,r*0.05);cx.lineCap='round';
    for(let i=0;i<tent;i++){
      const a=-Math.PI/2+(i/(tent-1||1)-0.5)*Math.PI*1.1;
      const baseX=p.x+Math.cos(a)*r*0.85,baseY=cy+Math.sin(a)*r*0.85;
      const wave=Math.sin(t*3.2+i*1.3+ph)*r*0.35;
      const tipX=baseX+Math.cos(a)*r*1.1+wave;
      const tipY=baseY+Math.sin(a)*r*1.1+Math.cos(t*2.6+i)*r*0.3;
      cx.beginPath();cx.moveTo(baseX,baseY);
      cx.quadraticCurveTo((baseX+tipX)/2+wave*0.6,(baseY+tipY)/2, tipX,tipY);cx.stroke();
      cx.fillStyle=flash?'#fff':'#ff7b9c';cx.beginPath();cx.arc(tipX,tipY,r*0.07,0,TAU2);cx.fill();
    }
    /* 主体：多层渐变球 + 裂纹随残血增多 */
    const bg=cx.createRadialGradient(p.x-r*0.3,cy-r*0.35,r*0.1,p.x,cy,r*1.02);
    bg.addColorStop(0,flash?'#fff':(hk>0.66?'#ff5a7a':'#ff7a4a'));
    bg.addColorStop(0.45,flash?'#fff':'#8a0018');
    bg.addColorStop(1,'#1a0008');
    cx.fillStyle=bg;cx.beginPath();cx.arc(p.x,cy,r*1.02*pulse,0,TAU2);cx.fill();
    /* 裂纹(残血越多) */
    if(rage>0.2){
      cx.strokeStyle='rgba(255,210,120,'+(0.35+rage*0.5)+')';
      cx.lineWidth=1.6;
      const cn=Math.floor(rage*7);
      for(let i=0;i<cn;i++){
        const a=i*2.4+ph,rr=r*0.9;
        const sx=p.x+Math.cos(a)*rr*0.4,sy=cy+Math.sin(a)*rr*0.4;
        cx.beginPath();cx.moveTo(sx,sy);
        cx.lineTo(sx+Math.cos(a+0.4)*rr*0.5,sy+Math.sin(a+0.4)*rr*0.5);
        cx.lineTo(sx+Math.cos(a)*rr*0.9,sy+Math.sin(a)*rr*0.9);cx.stroke();
      }
    }
    /* 核心之眼：脉动发光，越残血越狂 */
    const eyeR=r*(0.3+Math.sin(t*5+ph)*0.04);
    const eg=cx.createRadialGradient(p.x,cy,0,p.x,cy,eyeR*1.8);
    eg.addColorStop(0,'#fff');
    eg.addColorStop(0.3,flash?'#fff':(hk>0.66?'#ffd23d':'#ff9d3d'));
    eg.addColorStop(1,'rgba(255,45,85,0)');
    cx.fillStyle=eg;cx.beginPath();cx.arc(p.x,cy,eyeR*1.8,0,TAU2);cx.fill();
    cx.fillStyle='#fff';cx.beginPath();cx.ellipse(p.x,cy,eyeR*0.55,eyeR,0,0,TAU2);cx.fill();
    cx.fillStyle='#7a0018';
    const px2=p.x+Math.cos(Math.atan2(P.y-e.y,P.x-e.x))*eyeR*0.28;
    const py2=cy+Math.sin(Math.atan2(P.y-e.y,P.x-e.x))*eyeR*0.34;
    cx.beginPath();cx.ellipse(px2,py2,eyeR*0.22,eyeR*0.42,0,0,TAU2);cx.fill();
  }
  cx.restore();

let _bgCache={w:0,h:0};
function drawBG(){
  const T=G.t;
  if(!_bgCache.g||_bgCache.w!==VW||_bgCache.h!==VH){
    _bgCache.w=VW;_bgCache.h=VH;
    const g0=cx.createLinearGradient(0,0,0,VH);
    g0.addColorStop(0,"#0e4a6e");g0.addColorStop(0.28,"#0a3555");
    g0.addColorStop(0.6,"#061e38");g0.addColorStop(1,"#010810");
    _bgCache.g=g0;
    const vg=cx.createLinearGradient(0,VH*0.6,0,VH);
    vg.addColorStop(0,"rgba(0,4,10,0)");vg.addColorStop(1,"rgba(0,3,8,0.55)");
    _bgCache.vg=vg;
  }
  // 深海纵向渐变：上亮下暗
  cx.fillStyle=_bgCache.g;cx.fillRect(0,0,VW,VH);
  // 水下光柱（god rays）
  cx.save();cx.globalCompositeOperation='lighter';
  if(!_bgCache.ray){const rg=cx.createLinearGradient(0,0,120,VH);rg.addColorStop(0,'rgba(140,235,255,0.13)');rg.addColorStop(0.4,'rgba(90,190,245,0.055)');rg.addColorStop(1,'rgba(40,120,200,0)');_bgCache.ray=rg;}
  for(let i=0;i<6;i++){
    const base=(i/6)*VW + Math.sin(T*0.25+i*1.3)*70 - cam.x*0.05;
    const w=70+Math.sin(T*0.4+i*2.1)*36;
    cx.save();cx.translate(base,0);cx.fillStyle=_bgCache.ray;
    cx.beginPath();
    cx.moveTo(-w/2,0);cx.lineTo(w/2,0);
    cx.lineTo(w/2+110,VH);cx.lineTo(-w/2+110,VH);
    cx.closePath();cx.fill();
    cx.restore();
  }
  cx.restore();
  // 焦散波纹（水底光斑）
  cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=0.075;
  cx.strokeStyle='#8fe4ff';cx.lineWidth=2;
  const off=(cam.x*0.2+cam.y*0.2);
  for(let y=0;y<VH+80;y+=64){
    cx.beginPath();
    for(let x=0;x<=VW;x+=38){
      const yy=y+Math.sin((x+off)*0.012+T*1.1+y*0.03)*9+Math.sin(x*0.02-T*0.7)*4;
      x?cx.lineTo(x,yy):cx.moveTo(x,yy);
    }
    cx.stroke();
  }
  cx.restore();
  // 远景水母（柔光团）
  cx.save();cx.globalCompositeOperation='lighter';
  for(const j of seaJellies){
    const jx=((j.x - T*j.spd - cam.x*0.3)%(VW+400)+VW+400)%(VW+400)-200;
    const jy=((j.y + Math.sin(T*0.5+j.ph)*40)%(VH+200))-100;
    const jg=cx.createRadialGradient(jx,jy,0,jx,jy,j.r);
    jg.addColorStop(0,'hsla('+j.hue+',90%,70%,0.10)');
    jg.addColorStop(0.5,'hsla('+j.hue+',90%,60%,0.05)');
    jg.addColorStop(1,'hsla('+j.hue+',90%,50%,0)');
    cx.fillStyle=jg;cx.beginPath();cx.arc(jx,jy,j.r,0,TAU);cx.fill();
  }
  cx.restore();
  // 远景鱼群
  cx.save();
  for(const s of fishSchools){
    const span=VW+420;
    let bx=(s.off + T*s.spd*s.dir - cam.x*s.depth*0.35)%span;
    if(bx<0)bx+=span;
    bx-=210;
    for(const m of s.mem){
      const fx=bx+m.ox*s.dir;
      const fy=s.y+m.oy+Math.sin(T*1.8+m.ph)*8 - (cam.y*s.depth*0.12);
      if(fx<-70||fx>VW+70||fy<-70||fy>VH+70)continue;
      const sz=m.size,wig=Math.sin(T*8+m.ph)*0.4;
      cx.save();cx.translate(fx,fy);cx.scale(s.dir,1);
      cx.fillStyle=s.col+'0.42)';
      cx.beginPath();cx.ellipse(0,0,sz,sz*0.48,0,0,TAU);cx.fill();
      cx.beginPath();
      cx.moveTo(-sz*0.8,0);
      cx.lineTo(-sz*1.55,-sz*0.55+wig*sz*0.6);
      cx.lineTo(-sz*1.55,sz*0.55+wig*sz*0.6);
      cx.closePath();cx.fill();
      cx.restore();
    }
  }
  cx.restore();
  // 上浮气泡
  cx.save();cx.globalCompositeOperation='lighter';
  for(const b of bubbles){
    const span=VH+60;
    const yy=((b.y - T*b.spd - cam.y*0.15)%span+span)%span;
    const xx=((b.x - cam.x*0.15)%(VW+60)+VW+60)%(VW+60)-30 + Math.sin(T*1.2+b.wob)*8;
    cx.globalAlpha=b.op;
    cx.strokeStyle='rgba(160,235,255,0.85)';cx.lineWidth=1.1;
    cx.beginPath();cx.arc(xx,yy,b.r,0,TAU);cx.stroke();
    cx.fillStyle='rgba(215,248,255,0.7)';
    cx.beginPath();cx.arc(xx-b.r*0.32,yy-b.r*0.32,b.r*0.28,0,TAU);cx.fill();
  }
  cx.restore();cx.globalAlpha=1;
  // 底部压暗
  cx.fillStyle=_bgCache.vg;cx.fillRect(0,VH*0.6,VW,VH*0.4);
}
function w2s(x,y){return{x:x-cam.x+VW/2+cam.shakeX,y:y-cam.y+VH/2+cam.shakeY};}
function drawPlayer(){

  }

  // 受击红光

  }

  }

  setTimeout(showOpeningLine,600);
}
function gameOver(){
  hideOpeningLine();
  try{var _tp=document.getElementById('touchPad');if(_tp)_tp.style.display='none';}catch(e){}

document.getElementById('startBtn').onclick=startGame;

/* ===== Boss 净化过场 ===== */
function startPurify(b){
  /* 若正处于选卡界面，立即移除 */
  var _cb=document.getElementById('cards');
  if(_cb){_cb.style.display='none';_cb.innerHTML='';}
  cardOpen=false;pendingLv=0;G.paused=false;
  G.purify={on:true,phase:0,ct:0,boss:b,bx:b.x,by:b.y,cute:0};
  enemies.length=0;ebullets.length=0;
  G.boss=null;
  document.getElementById('bossbar').style.display='none';
  floatText(b.x,b.y-70,'……','#ff7b9c',26);
}
function updatePurify(dt){
  const Q=G.purify;if(!Q)return;
  Q.ct+=dt;
  if(Q.phase===0){
    /* 主角自动走近Boss */
    const dx=Q.bx-P.x,dy=Q.by-P.y,d=Math.hypot(dx,dy);
    const spd=200;
    if(d>70){
      P.x+=dx/d*spd*dt;P.y+=dy/d*spd*dt;
      if(Math.random()<0.5)spawnPart({x:P.x+rnd(-8,8),y:P.y+rnd(-8,8),vx:rnd(-20,20),vy:rnd(-20,20),life:0.5,size:rnd(2,3.5),color:'#7ee0ff',drag:0.92});
    }else if(Q.ct>2.2){
      Q.phase=1;Q.ct=0;
      SFX.levelup();
      floatText(Q.bx,Q.by-90,'净化','#7ee0ff',26);
    }
  }else if(Q.phase===1){
    Q.cute=Math.min(1,Q.ct/2.5);
    purifyLine(Math.min(PURIFY_TEXT.length,Math.floor(Q.ct/0.06)));
    if(Math.random()<0.7){
      const a=rnd(0,TAU),r0=rnd(20,80);
      spawnPart({x:Q.bx+Math.cos(a)*r0,y:Q.by+Math.sin(a)*r0,vy:-rnd(40,90),life:rnd(0.8,1.4),size:rnd(2,4),color:pick(['#a8dcff','#d6f0ff','#e8f9ff','#fff']),drag:0.98});
    }
    if(Q.ct>=2.5){Q.phase=2;Q.ct=0;SFX.win();addShake(12);
      for(let i=0;i<40;i++){const a=i/40*TAU;spawnPart({x:Q.bx+Math.cos(a)*30,y:Q.by+Math.sin(a)*30,vx:Math.cos(a)*260,vy:Math.sin(a)*260,life:1,size:4,color:'#a8dcff',drag:0.95});}
    }
  }else{
    purifyLine(PURIFY_TEXT.length);
    if(Q.ct>=1.2){hidePurifyLine();G.purify=null;winGame();}
  }
  cam.x+=(Q.bx-cam.x)*0.06;cam.y+=(Q.by-cam.y)*0.06;
}
/* ===== 净化台词气泡 ===== */
var PURIFY_TEXT='\u66E6\u66E6\u522B\u6015\uFF0C\u6211\u4EEC\u56DE\u5BB6\u5403\u96F6\u98DF\u5427\uFF01\uD83D\uDC95';
function purifyLine(n){
  var el=document.getElementById('purifyLine');
  if(!el){
    el=document.createElement('div');el.id='purifyLine';
    el.style.cssText='position:fixed;left:50%;bottom:16%;transform:translateX(-50%);z-index:60;max-width:86vw;padding:13px 22px;background:rgba(10,30,50,.86);border:2px solid rgba(255,160,210,.75);border-radius:18px;color:#ffe8f4;font-size:17px;font-weight:700;letter-spacing:1px;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 26px rgba(255,140,200,.4);backdrop-filter:blur(8px);opacity:0;transition:opacity .45s;pointer-events:none;text-align:center;';
    document.body.appendChild(el);
    requestAnimationFrame(function(){el.style.opacity='1';});
  }
  el.textContent=PURIFY_TEXT.slice(0,n);
}
/* ===== 开场台词 ===== */
var OPEN_TEXT='\u66E6\u66E6\uFF0C\u4F60\u5728\u54EA\u91CC\uFF1F\uD83D\uDCAD';
var _openTimer=null;
function showOpeningLine(){
  if(_openTimer){clearInterval(_openTimer);_openTimer=null;}
  var old=document.getElementById('openLine');
  if(old&&old.parentNode)old.parentNode.removeChild(old);
  var el=document.createElement('div');el.id='openLine';
  el.style.cssText='position:fixed;left:50%;bottom:16%;transform:translateX(-50%);z-index:60;max-width:86vw;padding:13px 22px;background:rgba(10,30,50,.86);border:2px solid rgba(255,160,210,.75);border-radius:18px;color:#ffe8f4;font-size:17px;font-weight:700;letter-spacing:1px;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 26px rgba(255,140,200,.4);backdrop-filter:blur(8px);opacity:0;transition:opacity .45s;pointer-events:none;text-align:center;';
  document.body.appendChild(el);
  requestAnimationFrame(function(){el.style.opacity='1';});
  var i=0;
  _openTimer=setInterval(function(){
    i++;el.textContent=OPEN_TEXT.slice(0,i);
    if(i>=OPEN_TEXT.length){
      clearInterval(_openTimer);_openTimer=null;
      setTimeout(function(){el.style.opacity='0';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},500);},2200);
    }
  },80);
}
function hideOpeningLine(){
  if(_openTimer){clearInterval(_openTimer);_openTimer=null;}
  var el=document.getElementById('openLine');
  if(el){el.style.opacity='0';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},500);}
}
function hidePurifyLine(){
  var el=document.getElementById('purifyLine');
  if(el){el.style.opacity='0';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},500);}
}
function drawPurify(){
  const Q=G.purify;if(!Q)return;
  const p=w2s(Q.bx,Q.by);
  const t=G.t;
  const c=Q.cute; /* 0暗红凶恶 → 1可爱 */
  /* 浮动与呼吸（随可爱度增强） */
  const bob=Math.sin(t*2.4)*7*c;
  const breathe=1+Math.sin(t*3.1)*0.06*c;
  const bounce=Q.phase===2?Math.sin(t*18)*Math.abs(Math.sin(t*18))*10*c:0; /* 完成时欢快弹跳 */
  const cx0=p.x, cy0=p.y+bob-bounce;
  const R=64*(0.86+0.14*c); /* 可爱时略缩更圆润 */
  cx.save();

  /* 净化光柱 */
  if(Q.phase===1){
    const k=Math.min(1,Q.ct/2.5);
    const beamW=110*k;
    const g=cx.createLinearGradient(cx0,cy0-420,cx0,cy0+220);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(0.35,'rgba(220,245,255,'+(0.4*k)+')');
    g.addColorStop(1,'rgba(150,215,255,'+(0.55*k)+')');
    cx.globalCompositeOperation='lighter';
    cx.fillStyle=g;
    cx.beginPath();cx.moveTo(cx0-beamW/2,cy0+220);cx.lineTo(cx0-beamW/3,cy0-420);
    cx.lineTo(cx0+beamW/3,cy0-420);cx.lineTo(cx0+beamW/2,cy0+220);cx.closePath();cx.fill();
    /* 光柱内上升亮点 */
    for(let i=0;i<6;i++){
      const ph=(t*0.8+i*0.16)%1;
      const sx=cx0+Math.sin(i*7+t)*beamW*0.3;
      const sy=cy0+200-ph*600;
      cx.globalAlpha=(1-ph)*0.7*k;
      cx.fillStyle='#fff';
      cx.beginPath();cx.arc(sx,sy,2+Math.sin(t*6+i)*1.5,0,TAU);cx.fill();
    }
    cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  }

  cx.translate(cx0,cy0);
  cx.scale(breathe,2-breathe); /* 呼吸时横涨竖缩，Q弹感 */

  /* ===== 触手（可爱时6条，凶恶时少） ===== */
  const tentCount=Math.round(2+4*c);
  for(let i=0;i<tentCount;i++){
    const spread=(i-(tentCount-1)/2)/((tentCount-1)/2||1);
    const tx=spread*R*0.62;
    const sw=Math.sin(t*4+i*1.3)*R*0.18*c;
    const len=R*(0.55+0.12*Math.sin(t*3+i));
    cx.strokeStyle=c>0.5?'#a8dcff':'#7a0018';
    cx.lineWidth=R*0.14;cx.lineCap='round';
    cx.beginPath();cx.moveTo(tx,R*0.7);
    cx.quadraticCurveTo(tx+sw,R*0.7+len*0.6,tx+sw*1.6,R*0.7+len);cx.stroke();
    /* 触手尖小圆 */
    cx.fillStyle=c>0.5?'#d6f0ff':'#a00';
    cx.beginPath();cx.arc(tx+sw*1.6,R*0.7+len,R*0.07,0,TAU);cx.fill();
  }

  /* ===== 身体 ===== */
  const bg=cx.createRadialGradient(-R*0.28,-R*0.34,R*0.1,0,0,R*1.05);
  if(c<0.5){
    bg.addColorStop(0,'#ff5a7a');bg.addColorStop(0.5,'#8a0018');bg.addColorStop(1,'#1a0008');
  }else{
    bg.addColorStop(0,'#f2fbff');bg.addColorStop(0.45,'#a8dcff');bg.addColorStop(1,'#5fb3e8');
  }
  cx.fillStyle=bg;
  cx.beginPath();cx.arc(0,0,R,0,TAU);cx.fill();
  /* 高光 */
  cx.fillStyle='rgba(255,255,255,'+(0.35+0.4*c)+')';
  cx.beginPath();cx.ellipse(-R*0.34,-R*0.42,R*0.26,R*0.16,-0.5,0,TAU);cx.fill();

  /* ===== 头顶小水滴触角 ===== */
  if(c>0.3){
    cx.globalAlpha=c;
    const sw2=Math.sin(t*3.5)*0.28;
    cx.strokeStyle='#8fd0f0';cx.lineWidth=R*0.07;cx.lineCap='round';
    cx.beginPath();cx.moveTo(0,-R*0.98);
    cx.quadraticCurveTo(R*0.1*sw2,-R*1.25,R*0.28*sw2,-R*1.38);cx.stroke();
    const dg=cx.createRadialGradient(R*0.28*sw2,-R*1.38,0,R*0.28*sw2,-R*1.38,R*0.16);
    dg.addColorStop(0,'#fff');dg.addColorStop(0.5,'#c8ecff');dg.addColorStop(1,'rgba(150,210,245,0)');
    cx.fillStyle=dg;cx.beginPath();cx.arc(R*0.28*sw2,-R*1.38,R*0.16,0,TAU);cx.fill();
    cx.globalAlpha=1;
  }

  /* ===== 脸部 ===== */
  if(c>0.2){
    cx.globalAlpha=c;
    /* 腮红 */
    cx.fillStyle='rgba(255,150,190,0.42)';
    cx.beginPath();cx.ellipse(-R*0.5,R*0.16,R*0.19,R*0.11,0,0,TAU);cx.fill();
    cx.beginPath();cx.ellipse(R*0.5,R*0.16,R*0.19,R*0.11,0,0,TAU);cx.fill();
    /* 眨眼：每3.2秒眨一次，持续0.14秒 */
    const bt=(t%3.2);
    const blink=bt<0.14?Math.max(0.08,Math.abs(bt-0.07)/0.07):1;
    /* 大眼睛 */
    const eyeY=-R*0.14, eyeDX=R*0.3, eyeR=R*0.24;
    for(const sgn of [-1,1]){
      const ex=sgn*eyeDX;
      /* 眼白 */
      cx.fillStyle='#fff';
      cx.beginPath();cx.ellipse(ex,eyeY,eyeR,eyeR*1.18*blink,0,0,TAU);cx.fill();
      /* 瞳孔 */
      cx.fillStyle='#3a2030';
      cx.beginPath();cx.ellipse(ex,eyeY+eyeR*0.05,eyeR*0.62,eyeR*0.74*blink,0,0,TAU);cx.fill();
      /* 高光两点 */
      cx.fillStyle='#fff';
      cx.beginPath();cx.arc(ex-eyeR*0.22,eyeY-eyeR*0.28,eyeR*0.2*blink,0,TAU);cx.fill();
      cx.beginPath();cx.arc(ex+eyeR*0.18,eyeY+eyeR*0.16,eyeR*0.1*blink,0,TAU);cx.fill();
    }
    /* ω 形小嘴 */
    cx.strokeStyle='#c2185b';cx.lineWidth=R*0.05;cx.lineCap='round';cx.lineJoin='round';
    const my=R*0.3, mw=R*0.16;
    cx.beginPath();
    cx.moveTo(-mw,my);
    cx.quadraticCurveTo(-mw*0.5,my+R*0.1,0,my);
    cx.quadraticCurveTo(mw*0.5,my+R*0.1,mw,my);
    cx.stroke();
    cx.globalAlpha=1;
  }
  cx.restore();

  /* ===== 环绕星星与爱心（世界坐标，不受身体缩放影响） ===== */
  if(c>0.4){
    cx.save();cx.globalCompositeOperation='lighter';
    for(let i=0;i<5;i++){
      const a=t*0.9+i/5*TAU;
      const orbR=R*(1.5+0.12*Math.sin(t*2+i));
      const sx=cx0+Math.cos(a)*orbR;
      const sy=cy0+Math.sin(a)*orbR*0.7-Math.abs(Math.sin(t*3+i))*14;
      const tw=0.55+0.45*Math.sin(t*6+i*1.7);
      cx.globalAlpha=c*0.9*tw;
      /* 四角星 */
      const ss=6+2*Math.sin(t*5+i);
      cx.fillStyle=i%2?'#ffe066':'#bfe8ff';
      cx.beginPath();
      for(let k=0;k<4;k++){const ang=k/4*TAU;cx.lineTo(sx+Math.cos(ang)*ss,sy+Math.sin(ang)*ss);cx.lineTo(sx+Math.cos(ang+0.39)*ss*0.35,sy+Math.sin(ang+0.39)*ss*0.35);}
      cx.closePath();cx.fill();
    }
    cx.globalAlpha=1;cx.globalCompositeOperation='source-over';cx.restore();
    /* 爱心缓缓上浮 */
    for(let i=0;i<3;i++){
      const ph=(t*0.42+i*0.34)%1;
      const hx=cx0+Math.sin(t*1.6+i*2.3)*R*1.1;
      const hy=cy0-R*0.9-ph*R*2.2;
      const hs=R*0.16*(1-ph*0.4);
      cx.save();cx.globalAlpha=c*(1-ph)*0.85;
      cx.fillStyle='#ff7aa8';
      cx.beginPath();
      cx.moveTo(hx,hy+hs*0.7);
      cx.bezierCurveTo(hx-hs,hy-hs*0.4,hx-hs*0.45,hy-hs,hx,hy-hs*0.35);
      cx.bezierCurveTo(hx+hs*0.45,hy-hs,hx+hs,hy-hs*0.4,hx,hy+hs*0.7);
      cx.fill();cx.restore();
    }
  }
  cx.restore();
}function winGame(){
  hidePurifyLine();hideOpeningLine();
  try{var _tp=document.getElementById('touchPad');if(_tp)_tp.style.display='none';}catch(e){}
  G.win=true;G.running=false;G.over=true;addShake(40);
  setTimeout(()=>{
    const o=document.getElementById('overlay');o.classList.remove('hidden');
    o.innerHTML='<h1 style="color:#ffd23d;text-shadow:0 0 40px #ffd23d">\u6DF1\u6E0A\u5DF2\u706D</h1><p class="big">\u4F60\u51FB\u8D25\u4E86\u6DF1\u6E0A\u4E4B\u4E3B \u00B7 \u7B49\u7EA7 '+G.level+' \u00B7 \u51FB\u6740 '+G.kills+' \u00B7 \u7528\u65F6 '+Math.floor(G.t)+'s</p><button id="startBtn">\u518D\u6218\u4E00\u6B21</button>';
  document.getElementById('startBtn').onclick=startGame;
  },1200);
}
document.getElementById('startBtn').onclick=startGame;
updateHUD();
requestAnimationFrame(loop);

<script id="mobile-joy">
(function(){
  function initJoy(){
    if(document.getElementById('touchPad'))return;
    var pad=document.createElement('div');pad.id='touchPad';
    var base=document.createElement('div');base.id='joyBase';
    var knob=document.createElement('div');knob.id='joyKnob';
    base.appendChild(knob);pad.appendChild(base);document.body.appendChild(pad);
    pad.style.cssText='position:fixed;left:0;bottom:0;width:100%;height:100%;z-index:2147483000;pointer-events:none;display:none;';
    base.style.cssText='position:absolute;left:28px;bottom:130px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(120,220,255,.55);background:rgba(40,120,180,.22);pointer-events:auto;touch-action:none;box-shadow:0 0 22px rgba(80,200,255,.3)';
    knob.style.cssText='position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(170,240,255,.95),rgba(70,180,240,.9));box-shadow:0 0 20px rgba(80,210,255,.8);pointer-events:none';
    var active=false,cx0=0,cy0=0,R=42;
    function getXY(e){var t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e);return{x:t.clientX,y:t.clientY};}
    function start(e){
      active=true;var r=base.getBoundingClientRect();cx0=r.left+r.width/2;cy0=r.top+r.height/2;
      move(e);if(e.preventDefault)e.preventDefault();
    }
    function move(e){
      if(!active)return;
      var p=getXY(e),dx=p.x-cx0,dy=p.y-cy0,d=Math.hypot(dx,dy);
      if(d>R){dx=dx/d*R;dy=dy/d*R;}
      knob.style.transform='translate('+dx+'px,'+dy+'px)';
      var nx=dx/R,ny=dy/R,K=window.keys;
      if(K){K['d']=nx>0.28;K['a']=nx<-0.28;K['s']=ny>0.28;K['w']=ny<-0.28;}
      if(e.preventDefault)e.preventDefault();
    }
    function end(e){
      active=false;knob.style.transform='';
      var K=window.keys;if(K){K['d']=K['a']=K['w']=K['s']=false;}
      if(e&&e.preventDefault)e.preventDefault();
    }
    base.addEventListener('touchstart',start,{passive:false});
    base.addEventListener('touchmove',move,{passive:false});
    base.addEventListener('touchend',end,{passive:false});
    base.addEventListener('touchcancel',end,{passive:false});
    base.addEventListener('mousedown',start);
    window.addEventListener('mousemove',function(e){if(active)move(e);});
    window.addEventListener('mouseup',function(e){if(active)end(e);});
  }
  var touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  function tryInit(){if(touch||innerWidth<=900){initJoy();}}
  tryInit();
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',tryInit);}else{setTimeout(tryInit,200);}
  window.addEventListener('resize',function(){if((touch||innerWidth<=820))initJoy();});
})();
